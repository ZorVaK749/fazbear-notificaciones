spring.application.name=fazbear-notificaciones
server.port=8085

# =============================================
# BASE DE DATOS H2 (log de notificaciones)
# =============================================
spring.datasource.url=jdbc:h2:mem:notificacionesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# =============================================
# SEGURIDAD: JWT via Azure Entra ID
# =============================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/ee0d2c5b-e60b-4c57-9b30-8a38a520c430/v2.0
spring.security.oauth2.resourceserver.jwt.client-id=304fa289-2b72-447b-9c48-f00998f7c22f
logging.level.org.springframework.security=WARN

# =============================================
# RABBITMQ (CloudAMQP — rellenar al crear cuenta)
# =============================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# =============================================
# SMTP — Envío de correos (Gmail con App Password)
# Generar en: myaccount.google.com > Seguridad > Contraseñas de aplicaciones
# =============================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:correo@gmail.com}
spring.mail.password=${MAIL_PASSWORD:app-password-aqui}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
